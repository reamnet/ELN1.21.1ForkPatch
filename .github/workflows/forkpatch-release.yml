name: Publish ForkPatch release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI run containing the tested mod-jar artifact
        required: true
        type: string
      release_id:
        description: Release ID targeting that tested commit (draft or versioned release)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: forkpatch-release-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify release and wait for its source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          python3 <<'PY'
          import json, os, re, subprocess, time
          repo = os.environ['GITHUB_REPOSITORY']
          run_id, release_id = os.environ['CI_RUN_ID'], os.environ['RELEASE_ID']
          assert run_id.isdigit() and release_id.isdigit(), 'IDs must be numeric'
          def api(route):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{route}']))
          release = api(f'releases/{release_id}')
          tag, sha = release['tag_name'], release['target_commitish']
          semantic = re.fullmatch(r'v(\d+\.\d+\.\d+)', tag)
          legacy = re.fullmatch(r'v\d+\.\d+\.\d+-port-forkpatch\.(\d+)', tag)
          assert semantic or legacy, 'Unexpected release tag'
          if legacy:
              assert release['draft'] and not release['assets'], 'Expected an empty legacy draft'
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'Release must target a fixed commit'
          if semantic:
              ref = api(f'git/ref/tags/{tag}')
              assert ref['object']['type'] == 'commit' and ref['object']['sha'] == sha, 'Version tag and release source differ'
          run = api(f'actions/runs/{run_id}')
          assert run['head_sha'] == sha, 'CI artifact and release source differ'
          assert run['head_repository']['full_name'].lower() == repo.lower(), 'Wrong source repository'
          assert run['path'] in ('.github/workflows/ci.yml', '.github/workflows/forkpatch-build.yml'), 'Expected a repository build workflow'
          for attempt in range(40):
              jobs = api(f'actions/runs/{run_id}/jobs?per_page=100')['jobs']
              builds = [j for j in jobs if j['name'] == 'Build and unit tests']
              assert len(builds) == 1, 'Expected one build job'
              build = builds[0]
              if build['status'] == 'completed':
                  assert build['conclusion'] == 'success', 'Source build failed'
                  break
              print('Waiting for source build and unit tests...', flush=True)
              time.sleep(15)
          else:
              raise RuntimeError('Source build did not finish in time')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              version = semantic[1] if semantic else ''
              filename = f'ElectricalAge-{version}.jar' if semantic else f'ElectricalAge-1.21.1-ForkPatch-{legacy[1]}.jar'
              out.write(f'tag={tag}\nversion={version}\nfilename={filename}\n')
          print(f'Publishing {tag} from tested commit {sha}')
          PY

      - name: Download the tested jar from that exact CI run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
          name: mod-jar
          path: release-input

      - name: Verify jar version, upload jar and checksum, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_FILENAME: ${{ steps.source.outputs.filename }}
        run: |
          set -euo pipefail
          mapfile -d '' jars < <(find release-input -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print0)
          [[ ${#jars[@]} -eq 1 ]] || { echo 'Expected one installable jar'; exit 1; }
          mkdir release-output
          filename="$RELEASE_FILENAME"
          if [[ -n "$RELEASE_VERSION" ]]; then
            [[ "$(basename "${jars[0]}")" == "$filename" ]] || { echo 'Jar filename and release version differ'; exit 1; }
            python3 - "${jars[0]}" "$RELEASE_VERSION" <<'PY'
          import sys, tomllib, zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              metadata = tomllib.loads(jar.read('META-INF/neoforge.mods.toml').decode())
          mods = [mod for mod in metadata['mods'] if mod['modId'] == 'eln']
          assert len(mods) == 1 and mods[0]['version'] == sys.argv[2], 'Embedded mod version and release differ'
          PY
          fi
          cp "${jars[0]}" "release-output/$filename"
          (cd release-output && sha256sum "$filename" > "$filename.sha256")
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "release-output/$filename" "release-output/$filename.sha256"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
