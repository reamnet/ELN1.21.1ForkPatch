org.gradle.jvmargs = -Xmx4G
org.gradle.parallel = true
org.gradle.caching = true
kotlin.daemon.jvmargs = -Xmx3G

# Human-readable mod name
modName = Electrical Age
# Case-sensitive mod id. Lowercase is mandatory since Minecraft 1.11.
modId = eln
# Root package
modGroup = mods.eln
# Release version: shared by the jar filename, mod metadata, and in-game version.
# Bump this for each update; a rebuild of the same version replaces that version's jar.
modVersion = 3.0.39

# Minecraft 1.21.1 / NeoForge 21.1 (the last 21.1.x at the time of the port; see PORT.md)
minecraftVersion = 1.21.1
neoVersion = 21.1.249
parchmentMinecraftVersion = 1.21.1
parchmentMappingsVersion = 2024.11.17
# Kotlin for Forge 5.x is the NeoForge 1.20.6-1.21.8 line; 5.12.0 bundles Kotlin 2.4.0, which is
# why the Kotlin Gradle plugin below is pinned to exactly that.
kffVersion = 5.12.0
kotlinVersion = 2.4.0
jadeVersion=15.10.6+neoforge
ccVersion=1.120.2
